name: Continuous Integration & Container Deployment

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =========================================================================
  # 1. CODE QUALITY & LINTING GATE
  # =========================================================================
  lint:
    name: Code Quality & Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Ruff Lint Checks
        run: uv run ruff check .

  # =========================================================================
  # 2. TEST SUITE WITH REDIS 8 & QDRANT SERVICES
  # =========================================================================
  test:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      ENV: "ci"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_dummy_test_key_for_unit_tests' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy_openai_api_key_for_ci' }}
      LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 || 'false' }}
      LANGCHAIN_ENDPOINT: ${{ secrets.LANGCHAIN_ENDPOINT || 'https://api.smith.langchain.com' }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY || 'dummy_langsmith_key' }}
      LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT || 'end-to-end-advanced-rag-with-llmops' }}
      REDIS_URL: "redis://127.0.0.1:6380/0"
      QDRANT_URL: "http://127.0.0.1:6333"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Pytest with Coverage
        run: |
          uv run pytest -v tests/ --cov=multi_doc_chat --cov-report=xml --cov-report=term

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 14

  # =========================================================================
  # 3. DOCKER BUILD, SMOKE TEST & PUBLISH TO CONTAINER REGISTRY
  # =========================================================================
  docker-publish:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Target Registries (GHCR & Docker Hub)
        id: registries
        run: |
          IMAGES="ghcr.io/${{ github.repository }}"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            DOCKER_REPO="${{ secrets.DOCKERHUB_REPO }}"
            if [ -z "$DOCKER_REPO" ]; then
              DOCKER_REPO="rag-app"
            fi
            IMAGES="${IMAGES}
          ${{ secrets.DOCKERHUB_USERNAME }}/${DOCKER_REPO}"
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          echo "images<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.registries.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Create Test Environment File for Smoke Testing
        run: |
          cat << EOF > .env
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'dummy_groq_key' }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || 'dummy_openai_key' }}
          LANGCHAIN_TRACING_V2=false
          LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
          LANGCHAIN_API_KEY=dummy_key
          LANGCHAIN_PROJECT=end-to-end-advanced-rag-with-llmops
          REDIS_URL=redis://redis:6379/0
          QDRANT_URL=http://qdrant:6333
          EOF

      - name: Build and Start Multi-Container Stack
        run: docker compose up -d --build

      - name: Verify Container Health via /healthz
        run: |
          echo "Waiting for rag-app service to transition to healthy..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' rag-app 2>/dev/null || echo '"starting"')
            echo "Attempt $i: rag-app status is $STATUS"
            if [ "$STATUS" = '"healthy"' ]; then
              echo "✅ rag-app is healthy!"
              break
            fi
            sleep 2
          done
          curl -f -s http://localhost:8000/healthz | grep -q '"status":"healthy"'
          echo "✅ Application healthcheck response verified successfully!"

      - name: Tear Down Smoke Test Stack
        if: always()
        run: docker compose down -v

      - name: Build and Push Docker Image to Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
