embedding_model:
  provider: "fastembed"
  model_name: "BAAI/bge-small-en-v1.5"

retriever:
  top_k: 5
  search_type: "similarity"

llm:
  groq:
    provider: "groq"
    model_name: "openai/gpt-oss-20b"
    temperature: 0
    max_output_tokens: 2048

  google:
    provider: "google"
    model_name: "gemini-2.0-flash"
    temperature: 0
    max_output_tokens: 2048
