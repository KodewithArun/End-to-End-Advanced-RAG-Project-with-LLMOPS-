embedding_model:
  provider: "fastembed"
  model_name: "BAAI/bge-small-en-v1.5"

retriever:
  top_k: 5
  search_type: "similarity"

llm:
  groq:
    provider: "groq"
    model_name: "openai/gpt-oss-20b"
    temperature: 0
    max_output_tokens: 2048

  google:
    provider: "google"
    model_name: "gemini-2.0-flash"
    temperature: 0
    max_output_tokens: 2048

persistence:
  enabled: true
  index_dir: "data/indexes"
  auto_reload_on_startup: true

vector_storage:
  backend: "qdrant" # "qdrant" or "in_memory"
  qdrant_url: null # e.g. "http://localhost:6333" or env QDRANT_URL; falls back to local disk
  local_path: "data/qdrant"
  collection_name: "documents_knowledge_base"
  retrieval_mode: "dense" # "dense" or "hybrid"

distributed_cache:
  backend: "redis" # "redis" or "in_memory"
  redis_url: null # e.g. "redis://localhost:6379/0" or env REDIS_URL; falls back to in-memory
  ttl_seconds: 3600
  similarity_threshold: 0.88
  l1_exact_enabled: true
  l2_semantic_enabled: true

alerting:
  enabled: true
  latency_threshold_ms: 2500.0
  low_score_threshold: 0.60
  max_buffered_alerts: 100
