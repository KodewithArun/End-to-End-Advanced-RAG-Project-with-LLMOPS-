[project]
name = "end-to-end-advanced-rag-project-with-llmops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KodewithArun", email = "contactwitharunlaudari@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.9",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "jinja2>=3.1.6",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.5",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.5",
    "langchain-qdrant>=0.2.0",
    "langchain-text-splitters>=1.2.0",
    "langsmith>=0.16.2",
    "openai>=3.60.0",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "qdrant-client>=1.12.0",
    "rapidocr-onnxruntime>=1.4.4",
    "redis>=5.2.0",
    "redisvl>=0.3.0",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "notebook",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"test*.py" = ["E402"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

